name: MoeMusic
version: '${version}'
main: org.lolicode.moemusic.spigot.MoeMusicPlugin
api-version: '1.18'
description: Server-side synced music playback for Spigot
authors: [KoishiMoe]
website: https://github.com/lolicode-org/MoeMusic-Minecraft
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:${kotlinRuntimeVersion}
  - org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${coroutinesVersion}
  - org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:${serializationVersion}
  - org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:${serializationVersion}
  - org.slf4j:slf4j-api:${slf4jVersion}
  - org.slf4j:slf4j-jdk14:${slf4jVersion}
commands:
  music:
    description: Controls MoeMusic playback and queue
    usage: /music help
