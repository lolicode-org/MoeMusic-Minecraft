[versions]
# MoeMusic and target versions.
moemusic-spigot = "1.3.0"
moemusic-api = "2.1.1"
moemusic-core = "1.3.1"
spigot-api = "1.18.2-R0.1-SNAPSHOT"

# Kotlin, runtime libraries, and build tooling.
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
slf4j = "2.0.18"
shadow = "9.4.2"

# Tests.
junit = "6.1.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
moemusic-api = { module = "org.lolicode.moemusic:api", version.ref = "moemusic-api" }
moemusic-core = { module = "org.lolicode.moemusic:core", version.ref = "moemusic-core" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
